
name: Reusable Deployment Workflow

on:
  workflow_call:
    inputs:
      target_env:
        required: true
        type: string
        description: "Target deployment environment"

    outputs:
      deployment_outcome:
        description: "Final deployment step outcome"
        value: ${{ jobs.deploy.outputs.step_result }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_env }}

    outputs:
      step_result: ${{ steps.capture-state.outputs.result }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@1d96c772d19495a3b5c517cd2bc0cb401ea0529f

      - name: Initialize Deployment Script
        run: |
          mkdir -p ./scripts
          cat > ./scripts/deploy.sh <<'EOF'
          #!/bin/bash
          set -e
          echo "Executing deployment for the configured environment..."
          EOF
          chmod +x ./scripts/deploy.sh

      - name: Execute Deployment
        id: do_deploy
        run: ./scripts/deploy.sh

      - name: Capture Deployment Outcome
        id: capture-state
        if: always()
        run: echo "result=${{ steps.do_deploy.outcome }}" >> "$GITHUB_OUTPUT"
